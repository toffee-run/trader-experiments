[project]
name = "traders-experiments"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ccxt>=4.5.78",
    "obstore>=0.11.1",
    "pandas>=3.0.5",
    "pandera[pandas]>=0.33.1",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
te = "traders_experiments:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
